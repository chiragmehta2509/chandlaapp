components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique user identifier
          example: 1
        name:
          type: string
          description: User's full name
          example: "John Doe"
        email:
          type: string
          format: email
          description: User's email address
          example: "john.doe@example.com"
        phone:
          type: string
          description: User's phone number (10 digits)
          nullable: true
          example: "9876543210"
        avatar:
          type: string
          format: uri
          nullable: true
          description: URL to user's profile picture
          example: "https://api.chandlabook.com/storage/avatars/user1.jpg"
        language:
          type: string
          description: Preferred language code
          enum: [en, hi, gu]
          default: en
          example: "en"
        subscription_status:
          type: string
          description: Current subscription plan
          enum: [free, premium, expired]
          default: free
          example: "free"
        subscription_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Subscription expiration date (null for free plan)
          example: "2024-12-31T23:59:59.000000Z"
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2024-01-01T10:00:00.000000Z"

    Event:
      type: object
      properties:
        id:
          type: integer
          description: Unique event identifier
          example: 1
        user_id:
          type: integer
          description: ID of the user who created the event
          example: 1
        title:
          type: string
          description: Event name/title
          maxLength: 255
          example: "Wedding Reception"
        description:
          type: string
          nullable: true
          description: Detailed event description
          example: "Join us for a celebration of love and joy"
        event_date:
          type: string
          format: date
          description: Event date (YYYY-MM-DD)
          example: "2024-06-15"
        event_time:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          nullable: true
          description: Event time (HH:MM in 24-hour format)
          example: "18:30"
        venue:
          type: string
          nullable: true
          maxLength: 255
          description: Event venue/location
          example: "Grand Ballroom, City Hotel"
        event_type:
          type: string
          enum: [wedding, birthday, anniversary, other]
          description: Category of the event
          default: other
          example: "wedding"
        cover_image:
          type: string
          format: uri
          nullable: true
          description: URL to event cover image
          example: "https://api.chandlabook.com/storage/events/cover1.jpg"
        is_archived:
          type: boolean
          description: Whether the event is archived
          default: false
          example: false
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000000Z"

    Contact:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 255
          example: "Jane Doe"
        phone:
          type: string
          nullable: true
          example: "9876543210"
        email:
          type: string
          format: email
          nullable: true
          example: "jane.doe@example.com"
        address:
          type: string
          nullable: true
          example: "123 Main Street, City"
        relationship:
          type: string
          nullable: true
          example: "Friend"
        avatar:
          type: string
          format: uri
          nullable: true
          example: "https://api.chandlabook.com/storage/contacts/avatar1.jpg"
        is_favorite:
          type: boolean
          default: false
          example: false
        notes:
          type: string
          nullable: true
          example: "Met at college"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000000Z"

    Entry:
      type: object
      description: Guest entry for an event
      properties:
        id:
          type: integer
          description: Unique entry identifier
          example: 1
        event_id:
          type: integer
          description: Associated event ID
          example: 1
        contact_id:
          type: integer
          nullable: true
          description: Associated contact ID (if guest is from contacts)
          example: 5
        guest_name:
          type: string
          maxLength: 255
          description: Guest's full name
          example: "Jane Smith"
        guest_phone:
          type: string
          nullable: true
          description: Guest's phone number
          example: "9876543210"
        guest_email:
          type: string
          format: email
          nullable: true
          description: Guest's email address
          example: "jane.smith@example.com"
        adults_count:
          type: integer
          minimum: 1
          default: 1
          description: Number of adults in the party
          example: 2
        children_count:
          type: integer
          minimum: 0
          default: 0
          description: Number of children in the party
          example: 1
        status:
          type: string
          enum: [pending, confirmed, declined, maybe]
          default: pending
          description: RSVP status
          example: "confirmed"
        notes:
          type: string
          nullable: true
          description: Additional notes about the guest
          example: "Vegetarian meal preference"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000000Z"

    Invitation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        event_id:
          type: integer
          example: 1
        entry_id:
          type: integer
          nullable: true
          example: 5
        invitation_code:
          type: string
          description: Unique code for RSVP
          example: "INV-ABC123"
        template_name:
          type: string
          nullable: true
          example: "elegant-wedding"
        type:
          type: string
          enum: [digital, physical]
          default: digital
          example: "digital"
        status:
          type: string
          enum: [draft, sent, viewed, responded]
          default: draft
          example: "sent"
        sent_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-15T10:00:00.000000Z"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000000Z"

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        event_id:
          type: integer
          nullable: true
          example: 1
        transaction_id:
          type: string
          description: Unique transaction identifier
          example: "TXN1234567890ABCD"
        amount:
          type: number
          format: float
          description: Amount in INR
          example: 1500.00
        status:
          type: string
          enum: [pending, completed, failed, refunded]
          default: pending
          example: "completed"
        payment_method:
          type: string
          enum: [upi, card, netbanking, wallet]
          default: upi
          example: "upi"
        razorpay_order_id:
          type: string
          nullable: true
          example: "order_ABC123XYZ"
        razorpay_payment_id:
          type: string
          nullable: true
          example: "pay_XYZ789ABC"
        razorpay_signature:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          example: "Event booking payment"
        paid_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-15T14:30:00.000000Z"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000000Z"

    Notification:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        title:
          type: string
          maxLength: 255
          example: "New RSVP Received"
        message:
          type: string
          example: "John Doe confirmed attendance for Wedding Reception"
        type:
          type: string
          enum: [rsvp, payment, invitation, general]
          default: general
          example: "rsvp"
        data:
          type: object
          nullable: true
          description: Additional notification data (JSON)
          example: { "event_id": 1, "entry_id": 5 }
        is_read:
          type: boolean
          default: false
          example: false
        read_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000000Z"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
            token_type:
              type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            current_page:
              type: integer
            data:
              type: array
              items:
                type: object
            per_page:
              type: integer
            total:
              type: integer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Unauthorized

    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation error
              errors:
                type: object

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Resource not found
