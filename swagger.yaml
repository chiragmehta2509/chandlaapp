openapi: 3.0.0
info:
  title: Chandla Book API
  description: |
    **Complete REST API for Chandla Book Mobile Application**
    
    This API provides comprehensive backend services for event management, contact organization, 
    guest tracking, digital invitations, and payment processing.
    
    ## Open Access
    All API endpoints are publicly accessible without authentication.
    No token or authorization headers are required.
    
    ## Rate Limiting
    API requests are rate-limited to 60 requests per minute per IP address.
    
    ## Response Format
    All API responses follow a consistent JSON structure:
    ```json
    {
      "success": true|false,
      "message": "Response message",
      "data": {}
    }
    ```
    
    ## Error Handling
    Error responses include appropriate HTTP status codes and detailed error messages.
  version: 1.0.0
  contact:
    name: API Support
    email: support@chandlabook.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server
  - url: https://api.chandlabook.com/api/v1
    description: Production Server

tags:
  - name: Authentication
    description: User authentication and registration (optional, for user tracking)
  - name: User
    description: User profile management
  - name: Notifications
    description: Push notifications and alerts
  - name: Events
    description: Event creation and management
  - name: Contacts
    description: Contact management and organization
  - name: Entries
    description: Guest list and RSVP management
  - name: Invitations
    description: Digital invitation creation and sending
  - name: Payments
    description: Payment processing via Razorpay/UPI
  - name: Reports
    description: Analytics and reporting
  - name: Sync
    description: Offline data synchronization

paths:
  /routes:
    get:
      tags: [Reports]
      summary: List all API endpoints
      description: Dynamically outputs a list of all GET/POST/PUT/DELETE endpoints inside the v1 API namespace.
      security: []
      responses:
        '200':
          description: Endpoints directory retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  routes:
                    type: array
                    items:
                      type: object
                      properties:
                        method:
                          type: string
                        uri:
                          type: string
                        name:
                          type: string
                        action:
                          type: string

  # --- Authentication ---
  /auth/google/login:
    post:
      tags: [Authentication]
      summary: Google Login
      description: Authenticate user using Google OAuth2 ID token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, email]
              properties:
                id_token:
                  type: string
                  description: Google ID token obtained from Google Sign-In
                  example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjE4MmU0NTBhMzVhMjA4MWZhYTFkOWFlMWQzMjM2YjkzYmE1OGE0Y2UiLCJ0eXAiOiJKV1QifQ..."
                email:
                  type: string
                  format: email
                  description: User's email address from Google
                  example: "user@example.com"
                name:
                  type: string
                  description: User's full name from Google
                  example: "John Doe"
                avatar:
                  type: string
                  format: uri
                  description: User's profile picture URL from Google
                  example: "https://lh3.googleusercontent.com/a/default-user"
            examples:
              google_login:
                summary: Example Google login request
                value:
                  id_token: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjE4MmU0NTBh..."
                  email: "john.doe@gmail.com"
                  name: "John Doe"
                  avatar: "https://lh3.googleusercontent.com/a/user-photo"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  summary: Successful authentication
                  value:
                    success: true
                    message: "Login successful"
                    data:
                      user:
                        id: 1
                        name: "John Doe"
                        email: "john.doe@gmail.com"
                        avatar: "https://lh3.googleusercontent.com/a/user-photo"
                        phone: null
                        language: "en"
                        subscription_status: "free"
                        created_at: "2024-01-01T10:00:00.000000Z"
                      token: "1|abcdefghijklmnopqrstuvwxyz123456789"
                      token_type: "Bearer"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/facebook/login:
    post:
      tags: [Authentication]
      summary: Facebook Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token, email]
              properties:
                access_token:
                  type: string
                  description: Facebook access token
                email:
                  type: string
                  format: email
                name:
                  type: string
                avatar:
                  type: string
                  format: uri
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/apple/login:
    post:
      tags: [Authentication]
      summary: Apple Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token, email]
              properties:
                identity_token:
                  type: string
                  description: Apple identity token
                email:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/phone/send-otp:
    post:
      tags: [Authentication]
      summary: Send SMS OTP
      description: Send One-Time Password to user's phone number via SMS
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^[0-9]{10}$'
                  description: 10-digit phone number
                  example: "9876543210"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 300
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/phone/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify Phone OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  pattern: '^[0-9]{10}$'
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "123456"
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Email/Password Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request Password Reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset Password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Current User Info
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User info retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change Password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  minLength: 8
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # --- User Profile ---
  /user/profile:
    get:
      tags: [User]
      summary: Get Profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags: [User]
      summary: Update Profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                language:
                  type: string
                  enum: [en, hi, gu]
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'

  /user/avatar:
    post:
      tags: [User]
      summary: Upload Avatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (jpeg, png, jpg, max 2MB)
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [User]
      summary: Delete Avatar
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Avatar deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /user/subscription:
    get:
      tags: [User]
      summary: Get Subscription Status
      responses:
        '200':
          description: Subscription info retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      is_active:
                        type: boolean

  /user/subscription/upgrade:
    post:
      tags: [User]
      summary: Upgrade Plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [monthly, yearly]
      responses:
        '200':
          description: Subscription upgraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /user/subscription/cancel:
    post:
      tags: [User]
      summary: Cancel Plan
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /user/stats:
    get:
      tags: [User]
      summary: General Account Stats
      responses:
        '200':
          description: Stats retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      total_events:
                        type: integer
                      active_events:
                        type: integer
                      total_contacts:
                        type: integer
                      total_entries:
                        type: integer

  # --- Notifications ---
  /notifications:
    get:
      tags: [Notifications]
      summary: List All
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Notifications retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    delete:
      tags: [Notifications]
      summary: Clear All
      responses:
        '200':
          description: All notifications cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /notifications/unread:
    get:
      tags: [Notifications]
      summary: Fetch Unread
      responses:
        '200':
          description: Unread notifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  count:
                    type: integer

  /notifications/device/register:
    post:
      tags: [Notifications]
      summary: Register FCM Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  description: FCM device token
                platform:
                  type: string
                  enum: [android, ios, web]
                device_id:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: View Alert Prefs
      responses:
        '200':
          description: Preferences retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      push_notifications_enabled:
                        type: boolean
                      email_notifications_enabled:
                        type: boolean
                      sms_notifications_enabled:
                        type: boolean
    put:
      tags: [Notifications]
      summary: Update Alert Prefs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_notifications_enabled:
                  type: boolean
                email_notifications_enabled:
                  type: boolean
                sms_notifications_enabled:
                  type: boolean
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  # --- Events ---
  /events:
    get:
      tags: [Events]
      summary: List All Events
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: type
          in: query
          schema:
            type: string
            enum: [wedding, birthday, anniversary, other]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Events retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      tags: [Events]
      summary: Create New Event
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, event_date]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                event_date:
                  type: string
                  format: date
                event_time:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                  example: "14:30"
                venue:
                  type: string
                  maxLength: 255
                cover_image:
                  type: string
                  format: binary
                  description: Image file (jpeg, png, jpg, max 2MB)
                event_type:
                  type: string
                  enum: [wedding, birthday, anniversary, other]
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Event'
        '422':
          $ref: '#/components/responses/ValidationError'

  /events/upcoming:
    get:
      tags: [Events]
      summary: Get Upcoming
      responses:
        '200':
          description: Upcoming events retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'

  /events/archived:
    get:
      tags: [Events]
      summary: Get Archived
      responses:
        '200':
          description: Archived events retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      tags: [Events]
      summary: Show Single Event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events]
      summary: Update Event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                event_date:
                  type: string
                  format: date
                event_time:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                venue:
                  type: string
                  maxLength: 255
                cover_image:
                  type: string
                  format: binary
                event_type:
                  type: string
                  enum: [wedding, birthday, anniversary, other]
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Events]
      summary: Remove Event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{id}/collaborators:
    get:
      tags: [Events]
      summary: View event collaborators
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Collaborators retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /events/{id}/stats:
    get:
      tags: [Events]
      summary: RSVPs and Stats for event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event stats retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /events/{id}/plan/razorpay-order:
    post:
      tags: [Events]
      summary: Create Razorpay Order for Event Unlimited Upgrade
      description: Initiates the process to upgrade the pricing plan of a single event to the Unlimited tier.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      order_id:
                        type: string
                      amount:
                        type: integer
                      key_id:
                        type: string

  /events/{id}/plan/razorpay-verify:
    post:
      tags: [Events]
      summary: Verify Razorpay Payment for Event Upgrade
      description: Verifies signature and activates the Unlimited tier upgrade.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                razorpay_order_id:
                  type: string
                razorpay_payment_id:
                  type: string
                razorpay_signature:
                  type: string
      responses:
        '200':
          description: Event successfully upgraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /events/{id}/direct-gpay-unlock/razorpay-order:
